<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Brain outline (simplified) -->
  <ellipse cx="50" cy="38" rx="26" ry="22" stroke="url(#ai-grad)" stroke-width="5" fill="none"/>
  <!-- Brain center divider -->
  <line x1="50" y1="18" x2="50" y2="58" stroke="url(#ai-grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Brain ridges left -->
  <path d="M 34 30 Q 28 36 34 44" stroke="url(#ai-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Brain ridges right -->
  <path d="M 66 30 Q 72 36 66 44" stroke="url(#ai-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Agent body base -->
  <rect x="37" y="58" width="26" height="10" rx="5" fill="url(#ai-grad)"/>
  <!-- Signal arcs -->
  <path d="M 22 22 Q 14 38 22 54" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 78 22 Q 86 38 78 54" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Label -->
  <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#a855f7">Agentic AI</text>
</svg>
