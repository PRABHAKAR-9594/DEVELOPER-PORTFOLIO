<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Edges -->
  <line x1="50" y1="18" x2="20" y2="62" stroke="url(#lg-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="18" x2="80" y2="62" stroke="url(#lg-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="62" x2="80" y2="62" stroke="url(#lg-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="18" x2="50" y2="62" stroke="url(#lg-grad)" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="50" cy="18" r="9" fill="url(#lg-grad)"/>
  <circle cx="20" cy="62" r="9" fill="url(#lg-grad)"/>
  <circle cx="80" cy="62" r="9" fill="url(#lg-grad)"/>
  <circle cx="50" cy="62" r="6" fill="#a855f7"/>
  <!-- Label -->
  <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#f97316">LangGraph</text>
</svg>
