<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C7C54"/>
      <stop offset="100%" stop-color="#28a745"/>
    </linearGradient>
  </defs>
  <!-- Chain link left -->
  <rect x="8" y="38" width="32" height="24" rx="12" ry="12" stroke="url(#lc-grad)" stroke-width="7" fill="none"/>
  <!-- Chain link right -->
  <rect x="60" y="38" width="32" height="24" rx="12" ry="12" stroke="url(#lc-grad)" stroke-width="7" fill="none"/>
  <!-- Connector bar -->
  <rect x="36" y="46" width="28" height="8" rx="4" fill="url(#lc-grad)"/>
  <!-- "LC" label -->
  <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#28a745">LangChain</text>
</svg>
